name: CI — Dana Motors Monorepo

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# BACKEND CI JOB  (server/ directory)
# ─────────────────────────────────────────────────────────────
jobs:
  backend-ci:
    name: 🔧 Backend CI (Node.js / Express + Prisma)
    runs-on: ubuntu-latest

    # Only run when server/** files changed (on push).
    # On pull_request events the job always runs so reviewers
    # get full feedback even for cross-cutting changes.
    if: |
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits.*.modified), 'server/') ||
      contains(toJSON(github.event.commits.*.added), 'server/')

    defaults:
      run:
        working-directory: server

    env:
      # Dummy values so the Zod env schema in config/index.ts
      # succeeds at build/typecheck time without a real DB.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/danamotors_ci?schema=public
      JWT_SECRET: ci-test-secret-32chars-minimum-ok
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-minimum
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      NODE_ENV: test

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v4

      - name: 🟢  Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦  Install dependencies
        run: npm ci

      - name: 🗃️  Generate Prisma Client
        run: npx prisma generate

      - name: 🔍  Typecheck (tsc --noEmit)
        run: npm run lint

      - name: 🏗️  Build (compile to dist/)
        run: npm run build

      # Placeholder — wire up real tests (Jest / Vitest) when added.
      - name: 🧪  Run tests
        run: |
          if npm run test --if-present 2>/dev/null; then
            echo "✅ Tests passed"
          else
            echo "ℹ️  No test script found — skipping"
          fi
        continue-on-error: false

# ─────────────────────────────────────────────────────────────
# FRONTEND CI JOB  (client/ directory)
# ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend CI (Next.js / React)
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits.*.modified), 'client/') ||
      contains(toJSON(github.event.commits.*.added), 'client/')

    defaults:
      run:
        working-directory: client

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v4

      - name: 🟢  Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: 📦  Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: 🔍  ESLint check
        run: yarn lint

      - name: 🏗️  Production build
        run: yarn build
        env:
          # Prevent Next.js from failing on missing real API env vars during CI build.
          # Set any NEXT_PUBLIC_ vars your app requires here.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

# ─────────────────────────────────────────────────────────────
# SECURITY & AUDIT JOB
# ─────────────────────────────────────────────────────────────
  security-audit:
    name: 🛡️  Security Audit
    runs-on: ubuntu-latest
    # Run on PRs and pushes to main — lightweight, always valuable.

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v4

      - name: 🟢  Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔒  Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high || true
        continue-on-error: true  # Warn but don't block — address audit items separately.

      - name: 🔒  Audit client dependencies
        working-directory: client
        run: yarn audit --level high || true
        continue-on-error: true
